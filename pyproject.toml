[project]
name = "email-agent-prompt-injection-benchmark"
version = "0.1.0"
description = "Controlled benchmark for indirect prompt injection in tool-calling LLM email agents."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
